name: Mise en ligne du site (Hostinger)

# À chaque modification du dossier server/ sur main, le site est envoyé sur l'hébergement par FTP.
# Les accès FTP sont des "secrets" GitHub (Settings > Secrets and variables > Actions) :
#   FTP_SERVER   : adresse FTP (ex. ftp.monsite.com ou une IP)
#   FTP_USERNAME : utilisateur FTP
#   FTP_PASSWORD : mot de passe FTP
#   FTP_DIR      : dossier du site sur le serveur, terminé par / (ex. public_html/pay/)
# config.php, data/ et install.php ne sont jamais envoyés : les réglages et la base restent intacts.

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "server-root/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier les accès FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: |
          missing=""
          for v in FTP_SERVER FTP_USERNAME FTP_PASSWORD FTP_DIR; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Secrets manquants :$missing. Ajoutez-les dans Settings > Secrets and variables > Actions."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Vérifier la syntaxe PHP
        run: find server -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Envoyer sur Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./server/
          server-dir: ${{ secrets.FTP_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            config.php
            data/**
            install.php

      - name: Page racine du domaine (redirection vers pay/)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./server-root/
          server-dir: public_html/
          state-name: .ftp-deploy-root-state.json

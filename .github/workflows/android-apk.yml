name: Application Android (APK)

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compiler l'APK
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk smspay-gateway.apk
      - uses: actions/upload-artifact@v4
        with:
          name: smspay-gateway-apk
          path: android/smspay-gateway.apk
      - name: Préparer l'APK pour le site
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p ../apk-out
          cp smspay-gateway.apk ../apk-out/smspay-gateway.apk
      # Met l'APK en téléchargement sur le site : <site>/pay/downloads/smspay-gateway.apk
      - name: Publier l'APK sur le site
        if: github.ref == 'refs/heads/main'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./apk-out/
          server-dir: pay/downloads/
          state-name: .ftp-deploy-apk-state.json
